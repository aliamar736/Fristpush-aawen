# Development / demo environment for GitHub Codespaces. Not for production.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Share the database container's network so the app reaches Postgres on localhost.
    network_mode: service:db
    depends_on: [db, redis]

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: aawen
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: aawen
    volumes:
      - aawen-db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  aawen-db:
