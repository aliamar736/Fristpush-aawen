# Local / staging stack. NOTE: written and reviewed but not built in the original build environment
# (Docker Hub was unreachable there). See docs/OPERATIONS.md.
name: aawen
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: aawen
      POSTGRES_USER: aawen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U aawen"], interval: 5s, retries: 20 }
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes: [media:/data]
    ports: ["9001:9001"]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 5; mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY};
      mc mb -p local/aawen-media; mc anonymous set none local/aawen-media; mc version enable local/aawen-media"
    environment: { S3_ACCESS_KEY: "${S3_ACCESS_KEY}", S3_SECRET_KEY: "${S3_SECRET_KEY}" }
  api:
    build: ../backend
    env_file: .env
    environment: &appenv
      DATABASE_URL: postgis://aawen:${POSTGRES_PASSWORD}@db:5432/aawen
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      USE_S3: "true"
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: aawen-media
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
    command: sh -c "python manage.py migrate --noinput && python manage.py seed_reference && gunicorn config.wsgi:application -b 0.0.0.0:8000 -w 3"
  worker:
    build: ../backend
    env_file: .env
    environment: *appenv
    depends_on: [api]
    command: celery -A config worker -l info --concurrency 2
  beat:
    build: ../backend
    env_file: .env
    environment: *appenv
    depends_on: [api]
    command: celery -A config beat -l info
  web:
    build: ../web
    depends_on: [api]
    ports: ["8080:80"]
volumes:
  dbdata:
  media:
