openapi: 3.0.3
info:
  title: AAWEN API — واجهة برمجة عاون
  version: 1.0.0
  description: Community civic-participation platform for Libya (Tripoli first).
paths:
  /api/v1/admin/audit/:
    get:
      operationId: admin_audit_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/admin/audit/{id}/:
    get:
      operationId: admin_audit_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا audit log.
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/admin/moderation/:
    get:
      operationId: admin_moderation_list
      description: 'Media moderation queue: approve, reject, or blur regions (faces,
        injured people, plates).'
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMediaList'
          description: ''
  /api/v1/admin/moderation/{uid}/:
    get:
      operationId: admin_moderation_retrieve
      description: 'Media moderation queue: approve, reject, or blur regions (faces,
        injured people, plates).'
      parameters:
      - in: path
        name: uid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
          description: ''
  /api/v1/admin/moderation/{uid}/decide/:
    post:
      operationId: admin_moderation_decide_create
      description: 'Media moderation queue: approve, reject, or blur regions (faces,
        injured people, plates).'
      parameters:
      - in: path
        name: uid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MediaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MediaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
          description: ''
  /api/v1/admin/roles/:
    get:
      operationId: admin_roles_list
      description: Only the system administrator grants/revokes roles; every change
        is audited.
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
      - in: query
        name: agency
        schema:
          type: integer
      - in: query
        name: area
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - accountant
          - agency_staff
          - ambassador
          - citizen
          - coordinator
          - financial_auditor
          - initiative_manager
          - reviewer
          - sysadmin
          - volunteer
        description: |-
          * `citizen` - مواطن
          * `ambassador` - سفير
          * `volunteer` - متطوع
          * `reviewer` - مراجع
          * `coordinator` - منسق
          * `agency_staff` - موظف جهة
          * `initiative_manager` - مسؤول مبادرة
          * `accountant` - محاسب
          * `financial_auditor` - مراجع مالي
          * `sysadmin` - مدير النظام
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoleAssignmentList'
          description: ''
    post:
      operationId: admin_roles_create
      description: Only the system administrator grants/revokes roles; every change
        is audited.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
          description: ''
  /api/v1/admin/roles/{id}/:
    get:
      operationId: admin_roles_retrieve
      description: Only the system administrator grants/revokes roles; every change
        is audited.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا role assignment.
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
          description: ''
    delete:
      operationId: admin_roles_destroy
      description: Only the system administrator grants/revokes roles; every change
        is audited.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا role assignment.
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/settings:
    get:
      operationId: admin_settings_retrieve
      description: Admin-tunable settings (road rules, routing tolerance, follow-up
        days, feature flags...).
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: admin_settings_partial_update
      description: Admin-tunable settings (road rules, routing tolerance, follow-up
        days, feature flags...).
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/users/:
    get:
      operationId: admin_users_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: عدد النتائج التي يجب إرجاعها في كل صفحة.
        schema:
          type: integer
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
    post:
      operationId: admin_users_create
      description: |-
        Create a staff/partner account by phone. No password is set: the person signs in with an OTP
        to their own phone (no default passwords).
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{id}/:
    get:
      operationId: admin_users_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا user.
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: admin_users_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا user.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/agencies/:
    get:
      operationId: agencies_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
