      - agencies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAgencyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAgencyRequest'
          multipart/form-data:
            schema:
