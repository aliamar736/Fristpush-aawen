              schema:
                $ref: '#/components/schemas/Agency'
          description: ''
    patch:
      operationId: agencies_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: نوع رقم صحيح فريد يحدد هذا agency.
