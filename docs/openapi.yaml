            application/json:
              schema:
                $ref: '#/components/schemas/Agency'
          description: ''
  /api/v1/announcements/:
    get:
      operationId: announcements_list
      parameters:
      - in: query
        name: agency
        schema:
          type: integer
      - in: query
        name: areas
        schema:
          type: array
          items:
            type: integer
        explode: true
        style: form
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: رقم الصفحة ضمن النتائج المقسمة.
