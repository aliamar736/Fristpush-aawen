          type: integer
      tags:
      - areas
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAreaList'
          description: ''
    post:
      operationId: areas_create
      tags:
      - areas
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaRequest'
          application/x-www-form-urlencoded:
            schema:
